<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal 3D Face</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #e8edf2; }
      #fps {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font: 14px/1 monospace;
      }
      #model-picker {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1;
        display: grid;
        gap: 6px;
        min-width: 190px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        color: white;
        font: 13px/1.2 system-ui, sans-serif;
      }
      #model-picker select {
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 4px;
        background: white;
        color: #1d1d1d;
      }
      #model-status { min-height: 1.2em; color: #d7dde5; }
      #sweep-toggle,
      #mouse-legend {
        position: fixed;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.72);
        color: white;
        font: 13px/1.2 system-ui, sans-serif;
      }
      #sweep-toggle {
        top: 12px;
        right: 12px;
        padding: 9px 13px;
        cursor: pointer;
      }
      #sweep-toggle:hover { background: rgba(0, 0, 0, 0.82); }
      #sweep-toggle:focus-visible { outline: 2px solid white; outline-offset: 2px; }
      #mouse-legend {
        right: 12px;
        bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 34px 10px 12px;
        color: #d7dde5;
        transition: width 160ms ease, height 160ms ease, padding 160ms ease;
      }
      #mouse-legend svg { width: 42px; height: 58px; flex: none; }
      #mouse-legend .legend-copy { display: grid; gap: 4px; white-space: nowrap; }
      #mouse-legend strong { color: white; font-weight: 600; }
      #legend-toggle {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #d7dde5;
        color: #20242a;
        cursor: pointer;
        font: bold 15px/20px system-ui, sans-serif;
      }
      #mouse-legend.collapsed {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      #mouse-legend.collapsed svg,
      #mouse-legend.collapsed .legend-copy { display: none; }
      #mouse-legend.collapsed #legend-toggle {
        top: 0;
        right: 0;
        width: 30px;
        height: 30px;
        border: 3px solid white;
        background: #111827;
        box-shadow: 0 2px 7px rgba(0, 0, 0, 0.55);
        color: transparent;
        line-height: 30px;
      }
      #mouse-legend.collapsed #legend-toggle::after {
        content: '';
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: #59a9ff;
      }
      canvas { display: block; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="fps">FPS: --</div>
    <button id="sweep-toggle" type="button" aria-pressed="false">Start sweep</button>
    <label id="model-picker">
      Model
      <select id="model-select">
        <option value="generated" selected>Generated face box</option>
        <option value="upload">Load a GLB file…</option>
      </select>
      <span id="model-status">Generated face box</span>
      <input id="glb-input" type="file" accept=".glb,model/gltf-binary" hidden />
    </label>
    <aside id="mouse-legend" aria-label="Mouse controls">
      <svg viewBox="0 0 42 58" aria-hidden="true">
        <rect x="5" y="2" width="32" height="52" rx="16" fill="none" stroke="white" stroke-width="2" />
        <path d="M21 3v20M6 23h30" fill="none" stroke="white" stroke-width="2" />
        <rect x="17" y="7" width="8" height="12" rx="4" fill="#8ec5ff" />
        <path d="M30 8c3 3 4 6 4 10" fill="none" stroke="#ffbf69" stroke-width="3" stroke-linecap="round" />
      </svg>
      <span class="legend-copy">
        <strong>Mouse controls</strong>
        <span><b>Middle drag</b> · Pan</span>
        <span><b>Right drag</b> · Orbit</span>
        <span><b>Wheel</b> · Zoom in/out</span>
      </span>
      <button id="legend-toggle" type="button" aria-label="Minimize mouse controls" aria-expanded="true">−</button>
    </aside>
    <script type="module" src="./main.js"></script>
  </body>
</html>
