<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal 3D Face</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #e8edf2; }
      #fps {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font: 14px/1 monospace;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="fps">FPS: --</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
