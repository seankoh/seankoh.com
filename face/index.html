<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal 3D Face</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #e8edf2; }
      #fallback-face {
        position: fixed;
        inset: 50% auto auto 50%;
        width: min(42vw, 220px);
        aspect-ratio: 2 / 3;
        transform: translate(-50%, -50%);
        border: 3px solid #5a3b2d;
        background: #f2c29b;
        box-shadow: 18px 20px 28px rgba(52, 36, 28, 0.2);
      }
      #fallback-face::before {
        content: "";
        position: absolute;
        top: 32%;
        left: 24%;
        width: 14%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #1d1d1d;
        box-shadow: 270% 0 #1d1d1d;
      }
      #fallback-face::after {
        content: "";
        position: absolute;
        left: 34%;
        bottom: 27%;
        width: 32%;
        height: 4%;
        background: #7a2e2e;
      }
      #fallback-nose {
        position: absolute;
        top: 48%;
        left: 50%;
        width: 0;
        height: 0;
        transform: translateX(-50%);
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-bottom: 25px solid #d8895f;
      }
      #fps {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        font: 14px/1 monospace;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="fallback-face" aria-label="Stylized face">
      <span id="fallback-nose"></span>
    </div>
    <div id="fps">FPS: --</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
